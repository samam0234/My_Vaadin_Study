server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m

spring:
  application:
    name: vaadin-study
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/board;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:1025}
  mongodb:
    uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/vaadin_study}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/vaadin_study}
      auto-index-creation: true
  cache:
    type: simple

app:
  cors-origin: ${CORS_ORIGIN:http://localhost:8080}
  token-secret: ${APP_SECRET:dev-only-change-me-please-32b}
  token-ttl-hours: 168
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  upload-max-bytes: 1048576
  ai-provider: ${AI_PROVIDER:mock}
  ai-url: ${AI_API_URL:}
  ai-model: ${AI_MODEL:gemma4:12b}
  ai-key: ${AI_API_KEY:}
  payment-secret: ${PAYMENT_SECRET:}
  mail-from: ${MAIL_FROM:board@localhost}
  mail-enabled: ${MAIL_ENABLED:false}

vaadin:
  launch-browser: false

logging:
  level:
    study.vaadin: INFO
