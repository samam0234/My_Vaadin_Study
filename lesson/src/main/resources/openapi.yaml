openapi: 3.0.3
info:
  title: Vaadin Study Board API
  version: 1.0.0
  description: 게시판 공통 API 스펙 v1. 목록은 data와 meta, 단건은 data, 오류는 error 객체다.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      responses:
        "200":
          description: 서버가 응답한다
  /api/auth/signup:
    post:
      responses:
        "201":
          description: 회원가입
        "409":
          description: EMAIL_TAKEN
  /api/auth/login:
    post:
      responses:
        "200":
          description: accessToken 발급
        "401":
          description: INVALID_CREDENTIALS
  /api/auth/logout:
    post:
      responses:
        "204":
          description: 토큰 폐기
  /api/auth/me:
    get:
      responses:
        "200":
          description: 내 정보
        "401":
          description: UNAUTHORIZED
  /api/posts:
    get:
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10, maximum: 50 }
        - in: query
          name: sort
          schema: { type: string, enum: [createdAt, -createdAt, -commentCount] }
      responses:
        "200":
          description: data 배열과 meta
    post:
      responses:
        "201":
          description: Location 헤더와 data
        "400":
          description: VALIDATION_ERROR
        "401":
          description: UNAUTHORIZED
  /api/posts/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: data
        "404":
          description: NOT_FOUND
    patch:
      responses:
        "200":
          description: 수정된 data
        "403":
          description: FORBIDDEN
    delete:
      responses:
        "204":
          description: 본문 없음
  /api/posts/{id}/comments:
    get:
      responses:
        "200":
          description: data 배열
    post:
      responses:
        "201":
          description: 댓글 생성
  /api/comments/{id}:
    delete:
      responses:
        "204":
          description: 댓글 삭제
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
  - bearer: []
