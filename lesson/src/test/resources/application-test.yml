spring:
  datasource:
    url: jdbc:h2:mem:board;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  mongodb:
    uri: mongodb://127.0.0.1:1/unused
  data:
    mongodb:
      uri: mongodb://127.0.0.1:1/unused

app:
  token-secret: test-secret-test-secret-test-secret
  mail-enabled: false
  ai-provider: mock
  cors-origin: http://localhost:8080

vaadin:
  launch-browser: false
